apiVersion: apps/v1
kind: Deployment
metadata:
  name: athe-storefront
  namespace: athe
spec:
  replicas: 2
  selector: { matchLabels: { app: athe-storefront } }
  template:
    metadata: { labels: { app: athe-storefront } }
    spec:
      containers:
        - name: storefront
          image: <ECR_REPO_URL>/athe-storefront:latest
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, initialDelaySeconds: 3 }
          livenessProbe: { httpGet: { path: /healthz, port: 8080 }, initialDelaySeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: athe-storefront, namespace: athe }
spec:
  selector: { app: athe-storefront }
  ports: [{ port: 80, targetPort: 8080 }]
---
