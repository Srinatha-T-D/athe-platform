apiVersion: v1
kind: Service
metadata:
  name: athe-backend-metrics
  namespace: athe
  labels:
    app: athe-backend
spec:
  selector: { app: athe-backend }
  ports:
    - name: metrics
      port: 4000
      targetPort: 4000
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: athe-backend
  namespace: athe
  labels:
    release: kube-prometheus-stack   # must match the Helm release label the Prometheus Operator watches
spec:
  selector:
    matchLabels: { app: athe-backend }
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
  namespaceSelector:
    matchNames: [athe]
