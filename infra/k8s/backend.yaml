apiVersion: apps/v1
kind: Deployment
metadata:
  name: athe-backend
  namespace: athe
  labels: { app: athe-backend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: athe-backend }
  template:
    metadata:
      labels: { app: athe-backend }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: athe-backend-sa   # IRSA-bound, see terraform/iam.tf
      containers:
        - name: backend
          image: <ECR_REPO_URL>/athe-backend:latest
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef: { name: athe-backend-secrets }
          resources:
            requests: { cpu: "150m", memory: "192Mi" }
            limits: { cpu: "500m", memory: "384Mi" }
          readinessProbe:
            httpGet: { path: /readyz, port: 4000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 4000 }
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: athe-backend
  namespace: athe
spec:
  selector: { app: athe-backend }
  ports:
    - port: 80
      targetPort: 4000
      name: http
