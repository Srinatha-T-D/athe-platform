# DO NOT commit real secrets. Apply this after filling in values, or better,
# use the External Secrets Operator to sync from AWS Secrets Manager (see
# infra/terraform/iam.tf for the IRSA role this expects).
apiVersion: v1
kind: Secret
metadata:
  name: athe-backend-secrets
  namespace: athe
type: Opaque
stringData:
  DATABASE_URL: "postgresql://athe:CHANGE_ME@<rds-endpoint>:5432/athe?schema=public"
  JWT_SECRET: "CHANGE_ME_LONG_RANDOM_STRING"
  CORS_ORIGIN: "https://shop.athe.example.com,https://admin.athe.example.com,https://staff.athe.example.com"
  AWS_REGION: "ap-south-1"
  UPLOADS_BUCKET: "athe-design-uploads-prod"
  PORT: "4000"
  NODE_ENV: "production"
